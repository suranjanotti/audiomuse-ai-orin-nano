# Remember to scale the worker to minimum 2
# docker compose up -d --scale audiomuse-ai-worker=2
services:
  # Redis service for RQ (task queue)
  redis:
    image: redis:7-alpine
    container_name: audiomuse-redis
    ports:
      - "6379:6379" # Expose Redis port to the host
    volumes:
      - ./data/redis:/data # Persistent storage for Redis data (host bind mount)
    restart: unless-stopped

  # PostgreSQL database service
  postgres:
    image: postgres:15-alpine
    container_name: audiomuse-postgres
    environment:
      POSTGRES_USER: "audiomuse"
      POSTGRES_PASSWORD: "CnuYjkxilRtCbK"
      POSTGRES_DB: "audiomusedb"
    ports:
      - "${POSTGRES_PORT}:5432" # Expose PostgreSQL port to the host
    volumes:
      - ./data/postgres:/var/lib/postgresql/data # Persistent storage for PostgreSQL data (host bind mount)
    restart: unless-stopped

  # AudioMuse-AI Flask application service
  audiomuse-ai-flask:
    image: audiomuse-orin:latest
    container_name: audiomuse-ai-flask-app
    ports:
      - "8006:8000"
    environment:
      SERVICE_TYPE: "flask"
      MEDIASERVER_TYPE: "jellyfin"
      JELLYFIN_URL: "http://192.168.8.128:8096"  # NucBox K9 IP
      JELLYFIN_USER_ID: "7f2c512d00a44f3f8ef7d14a539e27ca"
      JELLYFIN_TOKEN: "3736b647033147fabbdfa44238989b67"
#      MEDIASERVER_TYPE: "navidrome"
#      NAVIDROME_URL: "http://192.168.0.214:4533" #for example http://192.168.3.13:4533/
#      NAVIDROME_USER: "suranjan"
#      NAVIDROME_PASSWORD: "EHS9pbwZhxgpuJ"
      POSTGRES_USER: "audiomuse"
      POSTGRES_PASSWORD: "CnuYjkxilRtCbK"
      POSTGRES_DB: "audiomusedb"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      # GEMINI_API_KEY: "YOUR_GEMINI_API_KEY_HERE"
      TEMP_DIR: "/app/temp_audio"
    volumes:
      - ./data/temp-audio-flask:/app/temp_audio
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  # AudioMuse-AI RQ Worker service
  audiomuse-ai-worker:
    image: audiomuse-orin:latest
    runtime: nvidia
    environment:
      SERVICE_TYPE: "worker"
      MEDIASERVER_TYPE: "jellyfin"
      JELLYFIN_URL: "http://192.168.8.128:8096"  # NucBox K9 IP
      JELLYFIN_USER_ID: "7f2c512d00a44f3f8ef7d14a539e27ca"
      JELLYFIN_TOKEN: "3736b647033147fabbdfa44238989b67"
#      MEDIASERVER_TYPE: "navidrome"
#      NAVIDROME_URL: "http://192.168.0.214:4533" #for example http://192.168.3.13:4533/
#      NAVIDROME_USER: "suranjan"
#      NAVIDROME_PASSWORD: "EHS9pbwZhxgpuJ"
      POSTGRES_USER: "audiomuse"
      POSTGRES_PASSWORD: "CnuYjkxilRtCbK"
      POSTGRES_DB: "audiomusedb"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      AI_MODEL_PROVIDER: "OLLAMA"        # OLLAMA | GEMINI | NONE
      OLLAMA_SERVER_URL: "http://100.76.66.8:11434"        # http://100.67.220.92:11434
      OLLAMA_MODEL_NAME: "mistral:7b"         # mistral:7b
      # GEMINI_API_KEY: "YOUR_GEMINI_API_KEY_HERE"
      TEMP_DIR: "/app/temp_audio"
      NVIDIA_VISIBLE_DEVICES: "all"
      # Jetson Tegra GPUs don't expose NVML; without this, torch.cuda allocator
      # hits an INTERNAL ASSERT (NVML_SUCCESS == r) on the first allocation.
      PYTORCH_NVML_BASED_CUDA_CHECK: "0"
      # Whisper / MarianMT / e5 back on GPU after the CPU detour. Watching for
      # NVML asserts under memory pressure; lyrics_transcriber._log_memory_state
      # prints host+cuda memory on any Whisper load failure so we can tell
      # whether it is real OOM or an NVML quirk.
      LYRICS_USE_GPU: "true"
      # Suppress onnxruntime C++ warning logs (e.g. Conv fallback mode notices)
      ORT_LOGGING_LEVEL: "3"
      # Override Dockerfile CPU-only optimization flags (set for x86 Intel, harmful on Jetson GPU)
      ORT_DISABLE_ALL_OPTIMIZATIONS: "0"
      ORT_DISABLE_AVX512: "0"
      ORT_FORCE_SHARED_PROVIDER: "0"
      ORT_DISABLE_MEMORY_PATTERN_OPTIMIZATION: "0"
      # Mirror Intel device assignment: ALL ONNX models on CUDA (MusiCNN, DCLAP,
      # CLAP text, MuLan), torch models (Whisper, MarianMT, e5) on CUDA via the
      # Jetson torch wheel, Qwen on CPU (llama_cpp_python n_gpu_layers=0 is hardcoded).
      # Set MUSICNN_FORCE_CPU=1 / CLAP_FORCE_CPU=1 here if you ever need to fall back.
    volumes:
      - ./data/temp-audio-worker:/app/temp_audio
      - /usr/lib/aarch64-linux-gnu/nvidia/:/usr/lib/aarch64-linux-gnu/nvidia/
      - /usr/lib/aarch64-linux-gnu/tegra/:/usr/lib/aarch64-linux-gnu/tegra/
      - /usr/local/cuda/lib64/:/usr/local/cuda/lib64/
      - /usr/local/cuda/:/usr/local/cuda/  # if headers / tool directories needed      # also any other TensorRT related .so
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

# All persistent data lives under ./data/ on the host (no named volumes).
